<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>히말라야 14좌 플라이바이 — 8000m의 세계</title>
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000;
    font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif; }
  #map { position:absolute; inset:0; }

  /* ── 시작 오버레이 ─────────────────────────── */
  #intro {
    position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(ellipse at center, rgba(8,16,32,.55) 0%, rgba(2,6,14,.88) 100%);
    transition:opacity 1.2s ease; color:#fff; text-align:center;
  }
  #intro.hidden { opacity:0; pointer-events:none; }
  #intro h1 { font-size:clamp(28px,5vw,52px); font-weight:800; letter-spacing:.04em; margin:0;
    text-shadow:0 2px 30px rgba(0,0,0,.8); }
  #intro p { font-size:clamp(14px,2vw,18px); opacity:.75; margin:0; line-height:1.7; }
  #startBtn {
    margin-top:10px; padding:14px 46px; font-size:18px; font-weight:700; color:#04121f;
    background:linear-gradient(135deg,#cfe9ff,#7fc4ff); border:none; border-radius:999px;
    cursor:pointer; letter-spacing:.08em; box-shadow:0 4px 30px rgba(120,190,255,.45);
    transition:transform .2s, box-shadow .2s;
  }
  #startBtn:hover { transform:scale(1.05); box-shadow:0 6px 40px rgba(120,190,255,.7); }
  #loadingNote { font-size:13px; opacity:.5; }
  /* 언어 토글 */
  #langToggle { display:inline-flex; gap:4px; padding:4px; border-radius:999px;
    background:rgba(255,255,255,.08); border:1px solid rgba(150,195,255,.25); }
  #langToggle button { padding:7px 18px; border-radius:999px; border:none; cursor:pointer;
    font-size:14px; font-weight:700; font-family:inherit; color:rgba(255,255,255,.7);
    background:transparent; transition:all .2s; }
  #langToggle button.on { background:linear-gradient(135deg,#cfe9ff,#7fc4ff); color:#04121f; }
  #langToggle button:not(.on):hover { color:#fff; }
  /* 무한 반복 토글 */
  #loopToggle { padding:8px 18px; border-radius:999px; cursor:pointer;
    font-size:13px; font-weight:700; font-family:inherit;
    color:rgba(255,255,255,.7); background:rgba(255,255,255,.08);
    border:1px solid rgba(150,195,255,.25); transition:all .2s; }
  #loopToggle:hover { color:#fff; }
  #loopToggle.on { background:linear-gradient(135deg,#ffd97a,#ffb347); color:#13212e;
    border-color:rgba(255,230,160,.8); box-shadow:0 0 16px rgba(255,200,80,.5); }

  /* ── 봉우리 정보 카드 ──────────────────────── */
  #card {
    position:absolute; left:36px; bottom:88px; z-index:20; min-width:300px;
    padding:22px 28px; border-radius:18px; color:#fff;
    background:linear-gradient(160deg, rgba(10,22,40,.78), rgba(4,10,22,.85));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(140,190,255,.25);
    box-shadow:0 10px 50px rgba(0,0,0,.5);
    opacity:0; transform:translateY(24px); transition:opacity .9s ease, transform .9s ease;
    pointer-events:none;
  }
  #card.show { opacity:1; transform:translateY(0); pointer-events:auto; }
  #cardImg { display:none; width:100%; max-height:190px; object-fit:contain; border-radius:11px;
    margin-bottom:12px; border:1px solid rgba(140,190,255,.2); background:rgba(5,12,24,.55); }
  #cardActions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  #cardActions button, #cardActions a {
    padding:7px 13px; border-radius:999px; font-size:12.5px; font-weight:700;
    text-decoration:none; cursor:pointer; border:1px solid rgba(150,195,255,.35);
    background:rgba(70,120,180,.25); color:#d6eaff; transition:background .2s;
    font-family:inherit;
  }
  #cardActions button:hover, #cardActions a:hover { background:rgba(90,150,215,.45); }
  #panoBtn { background:linear-gradient(135deg,rgba(255,217,122,.85),rgba(255,179,71,.85)) !important;
    color:#1c2533 !important; border-color:rgba(255,225,160,.8) !important; }

  /* ── 정상 360° 모드 바 ─────────────────────── */
  #panoBar {
    position:absolute; top:22px; left:50%; transform:translate(-50%,-12px); z-index:22;
    display:flex; align-items:center; gap:14px; padding:10px 12px 10px 20px;
    border-radius:999px; color:#fff;
    background:rgba(4,10,22,.72); backdrop-filter:blur(12px);
    border:1px solid rgba(255,217,122,.4); box-shadow:0 6px 30px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .6s, transform .6s;
  }
  #panoBar.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #panoTitle { font-weight:800; font-size:15px; color:#ffd97a; }
  #panoHint { font-size:12.5px; opacity:.65; }
  #panoExit { padding:8px 16px; border-radius:999px; border:none; cursor:pointer;
    font-weight:700; font-size:13px; color:#13212e; font-family:inherit;
    background:linear-gradient(135deg,#cfe9ff,#7fc4ff); }
  #cardRank { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.15em;
    color:#0a1828; background:linear-gradient(135deg,#ffd97a,#ffb347); padding:4px 12px;
    border-radius:999px; margin-bottom:10px; }
  #cardRank.top1 { background:linear-gradient(135deg,#ffe9a8,#ffc83d); box-shadow:0 0 18px rgba(255,200,60,.6); }
  #cardKo { font-size:34px; font-weight:800; line-height:1.15; margin:0; }
  #cardEn { font-size:15px; opacity:.65; margin:2px 0 14px; letter-spacing:.05em; }
  #cardElev { font-size:44px; font-weight:800; font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg,#bfe3ff,#6db9ff); -webkit-background-clip:text;
    background-clip:text; color:transparent; line-height:1; }
  #cardElev small { font-size:20px; }
  #cardRegion { font-size:13px; opacity:.6; margin-top:10px; }

  /* ── 진행 바 ──────────────────────────────── */
  #progress {
    position:absolute; left:50%; bottom:28px; transform:translateX(-50%); z-index:20;
    display:flex; gap:7px; padding:10px 16px; border-radius:999px;
    background:rgba(4,10,22,.6); backdrop-filter:blur(10px);
    border:1px solid rgba(140,190,255,.18); opacity:0; transition:opacity 1s;
  }
  #progress.show { opacity:1; }
  .dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.22);
    transition:all .5s; cursor:pointer; }
  .dot.done { background:rgba(140,200,255,.65); }
  .dot.active { background:#ffd97a; transform:scale(1.5); box-shadow:0 0 10px rgba(255,217,122,.8); }

  /* ── 컨트롤 ──────────────────────────────── */
  #controls { position:absolute; right:28px; bottom:28px; z-index:20; display:flex; gap:10px;
    opacity:0; transition:opacity 1s; }
  #controls.show { opacity:1; }
  #controls button {
    width:46px; height:46px; border-radius:50%; border:1px solid rgba(140,190,255,.3);
    background:rgba(4,10,22,.65); backdrop-filter:blur(10px); color:#cfe6ff;
    font-size:17px; cursor:pointer; transition:background .2s;
  }
  #controls button:hover { background:rgba(40,80,130,.7); }
  #controls button.on { background:linear-gradient(135deg,#ffd97a,#ffb347); color:#13212e;
    border-color:rgba(255,230,160,.85); box-shadow:0 0 16px rgba(255,200,80,.5); }

  /* ── 전체화면 버튼 (항상 우상단) ──────────────── */
  #fsBtn {
    position:absolute; top:22px; right:22px; z-index:24;
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(140,190,255,.3);
    background:rgba(4,10,22,.6); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:#cfe6ff; font-size:18px; line-height:1; cursor:pointer; transition:background .2s;
  }
  #fsBtn:hover { background:rgba(40,80,130,.7); }
  @media (orientation:landscape) and (max-height:600px) {
    #fsBtn { top:12px; right:12px; width:38px; height:38px; font-size:15px; }
  }

  /* ── 엔딩 ────────────────────────────────── */
  #ending {
    position:absolute; inset:0; z-index:25; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; color:#fff; text-align:center;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(2,6,14,.7) 100%);
    opacity:0; pointer-events:none; transition:opacity 1.5s;
  }
  #ending.show { opacity:1; pointer-events:auto; }
  #ending h2 { font-size:clamp(24px,4vw,42px); font-weight:800; margin:0;
    text-shadow:0 2px 30px rgba(0,0,0,.9); }
  #ending p { opacity:.9; margin:0; text-shadow:0 1px 14px rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.8); }
  #replayBtn { margin-top:14px; padding:12px 38px; font-size:16px; font-weight:700;
    color:#04121f; background:linear-gradient(135deg,#cfe9ff,#7fc4ff); border:none;
    border-radius:999px; cursor:pointer; }

  /* ── 봉우리 마커/라벨핀 ────────────────────── */
  .pk { pointer-events:none; text-align:center; transition:opacity .5s; }
  .pk-label {
    display:inline-block; padding:4px 11px; border-radius:999px; white-space:nowrap;
    font-size:12px; font-weight:700; color:#fff; letter-spacing:.02em;
    background:rgba(6,14,28,.72); border:1px solid rgba(150,195,255,.35);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 2px 10px rgba(0,0,0,.45);
    transition:all .4s;
  }
  .pk-label span { margin-left:6px; font-weight:600; color:#9fd0ff; font-variant-numeric:tabular-nums; }
  .pk-stem { width:2px; height:16px; margin:0 auto;
    background:linear-gradient(rgba(255,255,255,.85), rgba(255,255,255,0)); }
  .pk-dot { width:9px; height:9px; margin:0 auto; border-radius:50%;
    background:#ffd97a; border:2px solid rgba(10,18,32,.7);
    box-shadow:0 0 8px rgba(255,217,122,.7); transition:all .4s; }
  .pk.far .pk-label, .pk.far .pk-stem { opacity:0; }
  .pk.active .pk-label { background:linear-gradient(135deg,#ffd97a,#ffb347); color:#13212e;
    border-color:rgba(255,230,160,.9); box-shadow:0 0 22px rgba(255,200,80,.65); font-size:13px; }
  .pk.active .pk-label span { color:#5a3c08; }
  .pk.active .pk-dot { transform:scale(1.35); }

  /* ── 국가 라벨 (줌아웃 시에만 표시) ──────────── */
  /* 밝은 하늘·지평선 위에서도 보이도록 흰 글자에 선명한 어두운 외곽선을 두른다 */
  .ctry { pointer-events:none; text-align:center;
    font-size:15px; font-weight:800; letter-spacing:.2em; color:#fff;
    text-shadow:
      0 0 3px rgba(0,0,0,.98),
      1px 1px 0 rgba(0,0,0,.9), -1px 1px 0 rgba(0,0,0,.9),
      1px -1px 0 rgba(0,0,0,.9), -1px -1px 0 rgba(0,0,0,.9),
      0 2px 14px rgba(0,0,0,.75);
    opacity:0; transition:opacity .8s; white-space:nowrap; }
  .ctry.show { opacity:1; }

  /* ── 모바일 세로: 가로로 돌리라는 안내 ──────── */
  #rotateHint { display:none; }
  @media (orientation:portrait) and (max-width:820px) and (pointer:coarse) {
    #rotateHint {
      display:flex; position:absolute; inset:0; z-index:50;
      flex-direction:column; align-items:center; justify-content:center; gap:22px;
      background:radial-gradient(ellipse at center, rgba(10,22,42,.96), rgba(2,6,14,.98));
      color:#fff; text-align:center; padding:0 34px;
    }
    .rh-phone { font-size:66px; transform-origin:center;
      animation:rotatePhone 2.4s ease-in-out infinite; }
    #rotateHint p { font-size:18px; line-height:1.65; opacity:.85; margin:0;
      font-weight:600; }
  }
  @keyframes rotatePhone {
    0%,35% { transform:rotate(0); }
    55%,100% { transform:rotate(-90deg); }
  }

  /* ── 일반 좁은 화면(세로 데스크탑 창 등) ─────── */
  @media (max-width:640px){
    #card { left:16px; right:16px; bottom:96px; min-width:0; padding:16px 20px; }
    #cardKo{font-size:26px;} #cardElev{font-size:34px;}
    #controls{right:16px;}
  }

  /* ── 모바일 가로: 사진을 텍스트 옆에 둔 가로 배치 ── */
  /* (safe-area-inset → 아이폰 노치/다이내믹아일랜드·홈인디케이터 회피) */
  @media (orientation:landscape) and (max-height:600px) {
    /* 사진(왼쪽) + 정보(오른쪽)를 나란히 → 카드 높이를 절반으로 */
    #card { left:max(12px, env(safe-area-inset-left)); right:auto;
      bottom:max(12px, env(safe-area-inset-bottom)); min-width:0; max-width:min(58vw,400px);
      padding:12px; border-radius:14px; display:flex; gap:13px; align-items:stretch; }
    #cardImgLink { flex:0 0 auto; display:flex; }
    #cardImg { width:112px; height:100%; max-height:none; min-height:112px;
      object-fit:cover; border-radius:9px; margin-bottom:0; align-self:stretch; }
    #cardBody { min-width:0; }
    #cardRank { font-size:10px; margin-bottom:5px; padding:3px 9px; }
    #cardKo { font-size:20px; }
    #cardEn { font-size:11.5px; margin:1px 0 6px; }
    #cardElev { font-size:25px; }
    #cardElev small { font-size:14px; }
    #cardRegion { font-size:11px; margin-top:5px; }
    #cardActions { margin-top:9px; gap:6px; }
    #cardActions button, #cardActions a { padding:5px 10px; font-size:11px; }
    #progress { bottom:max(12px, env(safe-area-inset-bottom)); padding:6px 11px; gap:5px; }
    .dot { width:7px; height:7px; }
    #controls { right:max(14px, env(safe-area-inset-right));
      bottom:max(14px, env(safe-area-inset-bottom)); gap:8px; }
    #controls button { width:40px; height:40px; font-size:15px; }
    #fsBtn { top:max(12px, env(safe-area-inset-top)); right:max(12px, env(safe-area-inset-right)); }
    #panoBar { top:max(12px, env(safe-area-inset-top)); padding:7px 9px 7px 16px; gap:10px; }
    #panoTitle { font-size:13px; }
    #panoHint { display:none; }
    #panoExit { padding:6px 13px; font-size:12px; }
    #intro h1 { font-size:clamp(24px,6vw,38px); }
    #intro p { font-size:14px; }
    #intro { gap:12px; }
    #startBtn { padding:11px 38px; font-size:16px; margin-top:4px; }
    #ending h2 { font-size:clamp(22px,5vw,34px); }
  }

  /* ── 아이폰 가로(매우 낮은 높이 ≤430px): 더 컴팩트하게 ── */
  @media (orientation:landscape) and (max-height:430px) {
    #card { max-width:min(54vw,340px); padding:10px; gap:11px; }
    #cardImg { width:92px; min-height:92px; }
    #cardKo { font-size:17px; }
    #cardEn { font-size:10.5px; margin:1px 0 5px; }
    #cardElev { font-size:21px; }
    #cardElev small { font-size:12px; }
    #cardRank { font-size:9px; margin-bottom:4px; padding:2px 8px; }
    #cardRegion { font-size:10px; margin-top:4px; }
    #cardActions { margin-top:7px; gap:5px; }
    #cardActions button, #cardActions a { padding:4px 8px; font-size:10px; }
    #controls button { width:36px; height:36px; font-size:14px; }
    #fsBtn { width:34px; height:34px; font-size:14px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<button id="fsBtn" title="전체화면 보기">⛶</button>

<div id="rotateHint">
  <div class="rh-phone">📱</div>
  <p id="rotateText">가로로 돌리면<br>봉우리를 더 웅장하게 감상할 수 있어요</p>
</div>

<div id="intro">
  <h1 id="introTitle">히말라야 14좌 플라이바이</h1>
  <p id="introSub">지구에서 가장 높은 14개의 봉우리를<br>낮은 곳에서 가장 높은 곳까지, 하늘에서 만나봅니다</p>
  <div id="langToggle">
    <button id="langKo">한국어</button>
    <button id="langEn">English</button>
  </div>
  <button id="loopToggle">🔁 <span id="loopLabel">무한 반복</span></button>
  <button id="startBtn">비행 시작</button>
  <div id="loadingNote">지형 데이터 로딩 중…</div>
</div>

<div id="card">
  <a id="cardImgLink" target="_blank" rel="noopener"><img id="cardImg" alt=""></a>
  <div id="cardBody">
    <span id="cardRank"></span>
    <h2 id="cardKo"></h2>
    <div id="cardEn"></div>
    <div id="cardElev"></div>
    <div id="cardRegion"></div>
    <div id="cardActions">
      <button id="panoBtn">⛰ 정상 360°</button>
      <a id="photoLink" target="_blank" rel="noopener">📷 사진</a>
      <a id="videoLink" target="_blank" rel="noopener">▶ 영상</a>
      <a id="wikiLink" target="_blank" rel="noopener">🌐 위키</a>
    </div>
  </div>
</div>

<div id="panoBar">
  <span id="panoTitle"></span>
  <span id="panoHint">드래그해서 둘러보세요</span>
  <button id="panoExit">투어로 돌아가기 ↩</button>
</div>

<div id="progress"></div>

<div id="controls">
  <button id="loopBtn" title="무한 반복">🔁</button>
  <button id="pauseBtn" title="일시정지/재생">⏸</button>
  <button id="skipBtn" title="다음 봉우리">⏭</button>
</div>

<div id="ending">
  <h2 id="endTitle">14좌 비행 완료</h2>
  <p id="endText">에베레스트 8,849m — 지구의 정점에서 비행을 마칩니다</p>
  <button id="replayBtn">다시 비행하기</button>
</div>

<script>
// ── 14좌 데이터: 낮은 봉우리 → 높은 봉우리 ──────────────────────────
const PEAKS = [
  { rank:14, ko:"시샤팡마",   en:"Shishapangma",  elev:8027, coord:[85.7792,28.3525], region:"티베트 (중국)",            regionEn:"Tibet (China)",            wiki:"Shishapangma" },
  { rank:13, ko:"가셔브룸 II", en:"Gasherbrum II", elev:8035, coord:[76.6533,35.7583], region:"카라코람 · 파키스탄/중국", regionEn:"Karakoram · Pakistan/China", wiki:"Gasherbrum II" },
  { rank:12, ko:"브로드피크",  en:"Broad Peak",    elev:8051, coord:[76.5683,35.8108], region:"카라코람 · 파키스탄/중국", regionEn:"Karakoram · Pakistan/China", wiki:"Broad Peak" },
  { rank:11, ko:"가셔브룸 I",  en:"Gasherbrum I",  elev:8080, coord:[76.6964,35.7244], region:"카라코람 · 파키스탄/중국", regionEn:"Karakoram · Pakistan/China", wiki:"Gasherbrum I" },
  { rank:10, ko:"안나푸르나",  en:"Annapurna I",   elev:8091, coord:[83.8203,28.5961], region:"네팔",                    regionEn:"Nepal",                    wiki:"Annapurna" },
  { rank:9,  ko:"낭가파르바트", en:"Nanga Parbat",  elev:8126, coord:[74.5892,35.2372], region:"파키스탄",                regionEn:"Pakistan",                 wiki:"Nanga Parbat" },
  { rank:8,  ko:"마나슬루",   en:"Manaslu",       elev:8163, coord:[84.5597,28.5497], region:"네팔",                    regionEn:"Nepal",                    wiki:"Manaslu" },
  { rank:7,  ko:"다울라기리",  en:"Dhaulagiri I",  elev:8167, coord:[83.4875,28.6967], region:"네팔",                    regionEn:"Nepal",                    wiki:"Dhaulagiri" },
  { rank:6,  ko:"초오유",     en:"Cho Oyu",       elev:8188, coord:[86.6608,28.0942], region:"네팔/티베트",             regionEn:"Nepal/Tibet",              wiki:"Cho Oyu" },

// 공칭 좌표와 지형 데이터의 어긋남 보정: 원좌표 반경 600m 안에서 가장 높은
// 지점을 찾아 핀을 옮긴다. 원형 탐색이라 이웃 봉우리로 건너뛰지 않고,
// 매번 현재 핀 위치의 고도와 비교하므로 더 정밀한 지형이 로드되면 자가 수정된다.
function refineMarkers(){
  PEAKS.forEach((p, i) => {
    const stepLat = 0.0008;                                  // 약 90m 간격
    const stepLng = stepLat / Math.cos(p.coord[1] * Math.PI / 180);
    let best = null;
    for (let dx = -7; dx <= 7; dx++){
      for (let dy = -7; dy <= 7; dy++){
        if (dx*dx + dy*dy > 45) continue;                    // 반경 약 600m 원 안만
        const pos = [p.coord[0] + dx * stepLng, p.coord[1] + dy * stepLat];
        const e = map.queryTerrainElevation(pos);
        if (e != null && (best === null || e > best.e)) best = { pos, e };
      }
    }
    if (!best) return;
    const m = markers[i].getLngLat();
    const cur = map.queryTerrainElevation([m.lng, m.lat]);
    if (cur == null || best.e > cur + 1) markers[i].setLngLat(best.pos);
  });
}
map.once("idle", refineMarkers);

// 고도 숫자 카운트업 애니메이션
function countUp(el, target, ms){
  const t0 = performance.now();
  (function tick(now){
    const k = Math.min(1, (now - t0) / ms);
    const v = Math.round(target * (1 - Math.pow(1 - k, 3)));
    el.innerHTML = v.toLocaleString() + "<small> m</small>";
    if (k < 1 && running && !paused) requestAnimationFrame(tick);
    else el.innerHTML = target.toLocaleString() + "<small> m</small>";
  })(t0);
}

const THUMB_LANGS = ["en", "de", "it", "fr", "es"];
function fetchThumb(wlang, title){
  return fetch("https://" + wlang + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title))
    .then(r => r.ok ? r.json() : null)
    .then(j => (j && j.thumbnail && j.thumbnail.source) ? j.thumbnail.source : null)
    .catch(() => null);
}
function loadThumb(p){
  const img = $("cardImg");
  img.style.display = "none";
  if (p._thumb){ img.src = p._thumb; img.style.display = "block"; return; }
  if (p._thumbFailed) return;
  (async () => {
    for (const wlang of THUMB_LANGS){
      const src = await fetchThumb(wlang, p.wiki);
      if (src){
        p._thumb = src;
        if (cardPeak === p){ img.src = src; img.style.display = "block"; }
        return;
      }
    }
    p._thumbFailed = true;
  })();
}

// ── 카메라 연출 ─────────────────────────────────────────────
// 타일이 모두 로드된 뒤에 다음 연출로 넘어간다 (해상도 튐 방지)
function whenTilesReady(cb, maxWait){
  if (map.areTilesLoaded()) return cb();
  let done = false;
  const onIdle = () => { if (!done) { done = true; cb(); } };
  map.once("idle", onIdle);
  later(() => { if (!done) { done = true; map.off("idle", onIdle); cb(); } }, maxWait || 12000);
}

// 두 좌표 사이 대원거리(km)
function distKm(a, b){
  const R = 6371, toR = Math.PI / 180;
  const dLat = (b[1] - a[1]) * toR, dLng = (b[0] - a[0]) * toR;
  const h = Math.sin(dLat/2)**2 +
            Math.cos(a[1]*toR) * Math.cos(b[1]*toR) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

// 접근: 봉우리 옆을 비스듬히 바라보며 천천히 날아간다
function approach(p, fromFar){
  phase = "approach";
  const myIdx = idx;
  const bearing = (idx * 67) % 360 - 180;      // 봉우리마다 다른 방향에서 접근
  markers.forEach((m, i) => m.getElement().classList.toggle("active", i === idx));
  // 이동 거리에 따라 속도·아치를 조절: 멀수록 더 느리게(타일이 따라올 시간 확보)
  // + 아치를 조금 높여 줌아웃 정점에서 저해상도 타일을 쓰게 해 검은 번쩍임 감소
  const from = map.getCenter();
  const t = Math.min(1, distKm([from.lng, from.lat], p.coord) / 550);  // 0(가까움)~1(550km+)
  map.flyTo({
    center: p.coord,
    zoom: 11.6,
    pitch: 67,
    bearing,
    speed: 0.125 - 0.075 * t,                  // 가까우면 0.125, 멀면 0.05 (먼 줌아웃을 더 천천히)
    curve: 1.25 + 0.45 * t,                    // 가까우면 1.25, 멀면 1.70 (높이 아치)
    essential: true
  });
  // 도착 후 타일이 다 로드될 때까지 기다렸다가 선회 시작 (블랙/깨짐 방지)
  map.once("moveend", () => {
    whenTilesReady(() => {
      refineMarkers();                         // 고해상도 지형 기준으로 핀 위치 재보정
      // 타일 페이드인이 끝날 잠깐의 여유를 더 준 뒤 선회
      later(() => {
        if (running && !paused && phase === "approach" && idx === myIdx) orbit(p);
      }, 700);
    });
  });
}

// 선회 시작(=360° 버튼 생성) 시점의 카메라 상태. 파노라마에서 복귀할 때
// 정확히 이 고도·관점으로 되돌아간다.
let panoReturnView = null;

// 선회: 봉우리 둘레를 천천히 돈다 (드론 오빗 샷)
function orbit(p){
  phase = "orbit";
  // 선회는 클램핑이 켜진 상태에서 진행 — 중심이 정상 높이를 따라가 카메라가
  // 봉우리를 위에서 내려다본다. (파노라마에서 돌아올 때 exitPano가 다시 켜준다)
  map.setCenterClampedToGround(true);
  showCard(p);
  const start = performance.now();
  const startBearing = map.getBearing();
  // 360° 버튼이 막 생성된 이 순간의 카메라를 스냅샷
  panoReturnView = { center: [p.coord[0], p.coord[1]],
    zoom: map.getZoom(), pitch: map.getPitch(), bearing: startBearing };
  const DURATION = 13000, SWEEP = 110;         // 13초간 110도, 줌은 고정
  let midRefined = false;
  (function spin(now){
    if (!running || paused || phase !== "orbit") return;
    const k = Math.min(1, (now - start) / DURATION);
    const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;   // easeInOut
    if (k > 0.4 && !midRefined){ midRefined = true; refineMarkers(); }
    map.jumpTo({
      center: p.coord,
      bearing: startBearing + SWEEP * e,
      pitch: 67 - 3 * Math.sin(k * Math.PI)
    });
    if (k < 1) orbitFrame = requestAnimationFrame(spin);
    else { refineMarkers(); hideCard(); later(next, 800); }
  })(start);
}

// ── 정상 360° 파노라마 모드 ─────────────────────────────────
// 정상 바로 위에 카메라를 세우고 천천히 회전한다. 드래그하면 자동 회전이
// 멈추고 자유롭게 둘러볼 수 있다.
let pano = null;
const PANO_HANDLERS = ["dragPan","dragRotate","scrollZoom","touchZoomRotate","doubleClickZoom","keyboard"];

function applyPano(){
  map.setCenterElevation(pano.alt);
  map.jumpTo({
    center: [pano.lng, pano.lat],
    bearing: pano.bearing,
    pitch: pano.pitch,
    zoom: 15.4
  });
}

function enterPano(){
  if (idx < 0 || phase === "pano") return;
  cancelAnimationFrame(orbitFrame); clearTimers(); map.stop();
  phase = "pano"; paused = true; $("pauseBtn").textContent = "▶";
  hideCard();
  const p = PEAKS[idx];
  const m = markers[idx].getLngLat();
  const ground = map.queryTerrainElevation([m.lng, m.lat]);
  pano = {
    lng: m.lng, lat: m.lat,
    alt: (ground != null ? ground : p.elev * 1.35) + 60,    // 정상 바로 위
    bearing: map.getBearing(), pitch: 81, auto: true, raf: null
  };
  map.setCenterClampedToGround(false);
  PANO_HANDLERS.forEach(h => map[h] && map[h].disable());
  $("panoTitle").textContent = peakName(p) + T[lang].panoSuffix;
  $("panoBar").classList.add("show");
  (function look(){
    if (phase !== "pano") return;
    if (pano.auto) pano.bearing += 0.12;                     // 한 바퀴 약 50초
    applyPano();
    pano.raf = requestAnimationFrame(look);
  })();
}

function exitPano(resume){
  if (phase !== "pano") return;
  cancelAnimationFrame(pano.raf);
  // 360° 버튼이 생성됐던 순간(선회 시작)의 카메라 상태로 복귀
  const view = panoReturnView || { center: PEAKS[idx].coord, zoom: 11.6, pitch: 67, bearing: map.getBearing() };
  // 파노라마 해제: 클램핑을 다시 켜서 중심점이 정상 높이를 따라가게 한다.
  // (파노라마에서는 clamped=false + 높은 고도로 정상에 카메라를 세웠으므로,
  //  여기서 클램핑을 복원해야 카메라가 다시 봉우리 위로 올라가 줌인이 풀린다.)
  map.setCenterClampedToGround(true);
  PANO_HANDLERS.forEach(h => map[h] && map[h].enable());
  $("panoBar").classList.remove("show");
  pano = null; phase = "idle";
  if (resume !== false){
    paused = false; $("pauseBtn").textContent = "⏸";
    // 360° 버튼이 막 떴던 그 고도·관점(줌·피치·방향)으로 정확히 복귀
    phase = "approach";
    const p = PEAKS[idx], myIdx = idx;
    map.flyTo({
      center: view.center, zoom: view.zoom, pitch: view.pitch, bearing: view.bearing,
      speed: 0.9, curve: 1.2, essential: true
    });
    map.once("moveend", () => {
      whenTilesReady(() => {
        if (running && !paused && phase === "approach" && idx === myIdx) orbit(p);
      });
    });
  }
}

// 드래그로 둘러보기 (파노라마 중에는 기본 지도 조작 대신 1인칭 시점 회전)
(function(){
  const canvas = map.getCanvas();
  let dragging = false, lx = 0, ly = 0;
  canvas.addEventListener("pointerdown", e => {
    if (phase !== "pano") return;
    dragging = true; pano.auto = false; lx = e.clientX; ly = e.clientY;
  });
  window.addEventListener("pointermove", e => {
    if (!dragging || phase !== "pano") return;
    pano.bearing -= (e.clientX - lx) * 0.22;
    pano.pitch = Math.min(85, Math.max(35, pano.pitch - (e.clientY - ly) * 0.15));
    lx = e.clientX; ly = e.clientY;
  });
  window.addEventListener("pointerup", () => { dragging = false; });
})();

function next(){
  if (!running) return;
  idx++;
  if (idx >= PEAKS.length){
    if (loopMode){                              // 무한 반복: 처음(시샤팡마)으로
      idx = -1;
      dots.forEach(d => d.classList.remove("done"));
      return next();
    }
    return finale();
  }
  updateDots();
  approach(PEAKS[idx], idx === 0);
}

function jumpTo(i){
  if (phase === "pano") exitPano(false);
  cancelAnimationFrame(orbitFrame); clearTimers(); map.stop(); hideCard();
  idx = i; updateDots(); paused = false; $("pauseBtn").textContent = "⏸";
  approach(PEAKS[idx], true);
}

function finale(){
  running = false; phase = "idle";
  dots.forEach(d => { d.classList.remove("active"); d.classList.add("done"); });
  markers.forEach(m => m.getElement().classList.remove("active"));
  map.flyTo({ center: [86.925, 27.9881], zoom: 7.5, pitch: 45, bearing: 0, speed: 0.3, curve: 1.3 });
  ending.classList.add("show");
}

function startTour(){
  if (phase === "pano") exitPano(false);
  ending.classList.remove("show");
  intro.classList.add("hidden");
  progress.classList.add("show");
  controls.classList.add("show");
  running = true; paused = false; idx = -1;
  $("pauseBtn").textContent = "⏸";
  next();
}

// ── 컨트롤 ─────────────────────────────────────────────────
$("startBtn").addEventListener("click", startTour);
$("replayBtn").addEventListener("click", startTour);
$("skipBtn").addEventListener("click", () => { if (running) jumpTo(Math.min(idx + 1, PEAKS.length - 1)); });
$("pauseBtn").addEventListener("click", () => {
  if (!running) return;
  if (phase === "pano") return exitPano();   // 파노라마 중이면 투어 재개
  paused = !paused;
  $("pauseBtn").textContent = paused ? "▶" : "⏸";
  if (paused) { cancelAnimationFrame(orbitFrame); map.stop(); }
  else approach(PEAKS[idx], false);   // 현재 봉우리로 재접근 후 선회 재개
});
$("panoBtn").addEventListener("click", enterPano);
$("panoExit").addEventListener("click", () => exitPano());

// ── 전체화면 ────────────────────────────────────────────────
const fsEl = document.documentElement;
const fsSupported = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFs(){
  if (!isFs()){
    (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
function syncFsBtn(){
  const on = isFs();
  $("fsBtn").textContent = on ? "✕" : "⛶";
  $("fsBtn").title = on ? T[lang].fsExit : T[lang].fsTitle;
  setTimeout(() => map.resize(), 120);   // 화면 크기 변동 반영
}
if (fsSupported){
  $("fsBtn").addEventListener("click", toggleFs);
  document.addEventListener("fullscreenchange", syncFsBtn);
  document.addEventListener("webkitfullscreenchange", syncFsBtn);
} else {
  $("fsBtn").style.display = "none";     // 아이폰 사파리 등 미지원 기기
}

let mapReady = false;
map.on("load", () => {
  mapReady = true;
  $("loadingNote").textContent = T[lang].ready;
  // 클램핑(중심점이 지형 표면을 따라감)은 기본값 그대로 켜둔다 — 이래야 봉우리에
  // 접근했을 때 카메라 중심이 정상 높이까지 올라가 봉우리를 위에서 내려다보며
  // 웅장하게 담을 수 있다. (클램핑을 끄면 중심이 해수면에 박혀 카메라가 봉우리
  // 아래로 내려가 줌인된 것처럼 보인다.)
});

// ── 언어 적용 ───────────────────────────────────────────────
function applyLang(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $("introTitle").innerHTML = t.title;
  $("introSub").innerHTML = t.subtitle;
  $("startBtn").textContent = t.start;
  $("loadingNote").textContent = mapReady ? t.ready : t.loading;
  $("rotateText").innerHTML = t.rotate;
  $("panoBtn").textContent = t.pano;
  $("photoLink").textContent = t.photo;
  $("videoLink").textContent = t.video;
  $("wikiLink").textContent = t.wiki;
  $("panoHint").textContent = t.panoHint;
  $("panoExit").textContent = t.panoExit;
  $("endTitle").textContent = t.endTitle;
  $("endText").textContent = t.endText;
  $("replayBtn").textContent = t.replay;
  $("pauseBtn").title = t.pauseTitle;
  $("skipBtn").title = t.skipTitle;
  $("fsBtn").title = t.fsTitle;
  // 언어 토글 버튼 활성 상태
  $("langKo").classList.toggle("on", lang === "ko");
  $("langEn").classList.toggle("on", lang === "en");
  $("loopLabel").textContent = t.loop;
  $("loopToggle").classList.toggle("on", loopMode);
  $("loopBtn").title = t.loop;
  $("loopBtn").classList.toggle("on", loopMode);
  // 지도 위 동적 텍스트 갱신
  refreshMarkerNames();
  refreshCountryNames();
  if (cardPeak && card.classList.contains("show")) showCard(cardPeak);
  if (phase === "pano" && idx >= 0) $("panoTitle").textContent = peakName(PEAKS[idx]) + t.panoSuffix;
}
function setLang(l){ if (l === lang) return; lang = l; applyLang(); }
$("langKo").addEventListener("click", () => setLang("ko"));
$("langEn").addEventListener("click", () => setLang("en"));
function setLoop(on){
  loopMode = on;
  $("loopToggle").classList.toggle("on", on);
  $("loopBtn").classList.toggle("on", on);
}
$("loopToggle").addEventListener("click", () => setLoop(!loopMode));
$("loopBtn").addEventListener("click", () => setLoop(!loopMode));
applyLang();
</script>
</body>
